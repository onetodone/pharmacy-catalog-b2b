name: Build

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    env:
      # Prisma's config (app-nest/prisma.config.ts) requires DATABASE_URL to be
      # present even for `prisma generate`, which runs on `pnpm install`. No
      # database is contacted during the build.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pharmacy_catalog?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (app-nest + app-vite)
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Lint
        run: pnpm -r lint
